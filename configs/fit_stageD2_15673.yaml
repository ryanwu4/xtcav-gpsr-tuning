# Stage-D2 configuration — E300_15673 refit with the 37-knob C_B3_ema CNF
# (twobunch_cnf bundle; interview decisions 2026-10-29, memory project_stageD2_plan).
# Everything not listed in the D2 block below is carried VERBATIM from
# fit_stageD_15673.yaml (geometry, kernel, particles, anchor, V_eff anchor, loss
# weights), so the δ=0 null and every arm compare like-for-like with Stage D.
cnf_bundle: c_b3_ema
# Stage-D MAP fit configuration — dataset E300_15673 (plan D2, critic-corrected).
# σ_j values remain DRAFTS with provenance flags (D0.6: Ryan/ops sign-off pending;
# results are provisional until then).
segment_spec: configs/segment_15673.json   # D0.1: 15673 value_match BACTs (entrance R12 −20.59)

dataset: E300_15673
machine_config: /home/rwu4/photoinjector-rl/XTCAV_analysis/sim2real/results/tier1_sim_scans/E300_15673/machine_config.json
targets_npz: results/stageD/15673/targets.npz

# --- geometry / rendering (v2 kernel policy, 2026-08-05, critic-reviewed) ----
dtotr2_extra_drift_m: 0.6      # the +0.6 m DTOTR2 z-correction (fixed, never co-fit with V_eff)
bandwidth_um: 30.5             # FROZEN 1-px kernel, both axes. v1's 264 µm (σ_eff-derived)
                               # is refuted by the data: as a Gaussian sigma it implies
                               # FWHM 2.355*264 = 622 µm, but the real streaked core is
                               # 274 µm FWHM (blur_decomposition.json). In-data PSF bound
                               # from that core against the model's 214 µm FWHM at 1 px:
                               # sqrt(274.5^2-213.5^2)/2.355 = 73 µm. DTOTR2 is the
                               # in-vacuum OTR monitor (Storey PRAB 27,051302 — cite the
                               # specific figure before quoting its resolution numbers).
                               # Instrument = pixel box (sigma 8.8 µm) + small optics.
                               # The freed width discrepancy moved into PHYSICS nuisances
                               # (sdelta/ex below) — never back into the kernel.
bandwidth_scan: [0.7, 1.0, 1.3]  # pre-registered model-side sensitivity multipliers
n_particles: 65536             # per bunch. REQUIRED at 1 px: measured KDE-TV pair noise
                               # 0.173 @16k (> real floor 0.124, unusable), 0.089 @64k.
anchor: image_com              # D1/M6: shared IMAGE-space pixel-COM op on BOTH sides
                               # (model renders anchor='none', then com_center_image).

# --- physics nuisances (per-bunch scale_bunch). ALL nuisance priors are
# LAMBDA-SCALED (v3.1 fix): sigma means 'a deviation of sigma costs the same
# as a knob at 1 sigma_j'. v3 had them unit-weight, i.e. 1/lambda ~ 100x too
# strong, which froze every nuisance and failed the D0.2 sdelta recovery gate.
# sdelta: pz-spread scale about each bunch's mean — the residual projected
# energy-spread deficit. REVISED 2026-08-07 after the handoff back-drift fix
# (see sdelta_backdrift_check.json): the pre-fix y-deficit of 2.08x (streaked) /
# 2.16x (off) was ~41% an artifact of the missing 1.0334 m of transport, which
# made R34 31% wrong. Post-fix the real residual is ~1.54x / 1.59x — real, so
# the nuisance stays, but as a modest surrogate-error correction rather than a
# 2-3x rescue. Prior tightened 1.1 -> 0.35 so it cannot act as a free width knob
# (1.5x sits at 1.16 sigma). Caveat: the deficit is step-dependent (at deep
# compression sdelta barely moves y at all), so a global scale cannot close the
# scan and a late-step y residual is expected — that part is flow fidelity.
sdelta_prior_sigma_ln: 0.35
# ex: (x,px)-spread scale about each bunch's centroid — emittance-scale nuisance
# (PSF–ε degeneracy broken by the FROZEN kernel policy). ε_y NOT fitted:
# dispersion-dominated y makes it unidentifiable (3-way degenerate w/ nu_y+sdelta).
ex_prior_sigma_ln: 0.4         # allows ~1.5×
# δ_tr (Q2/Q1/Q0FF fractional k1) prior — v2.1. δ_tr was the ONE unregularized
# DOF: harmless under the 264 µm blur (dtr stayed <0.1%), but at the 1-px kernel
# it becomes a free 3-DOF width knob. Q2/Q1/Q0FF are the same magnet class as
# Q5/Q4/Q3FF, whose σ_j is 0.5% of setting — same prior, in fractional units.
dtr_prior_sigma_frac: 0.005    # TODO-ryan/ops (same provenance as the FF quad σ_j)

# --- conditioning (D2) --------------------------------------------------------
l1_anchor_deg: -20.0           # FIXED for all steps (critic M4: recorded per-step KLYS deltas
                               # are BC11-feedback drift compensation, corr −0.94; the servo-
                               # anchored convention drops them). Sensitivity variant: one
                               # refit WITH the recorded deltas, reported alongside.
l2_ref_deg: -37.9              # fitted L2_ref (tier2 CONCLUSIONS.md); becomes a fitted
                               # nuisance: scalar shift on the L2 column, prior σ below.
l2ref_sigma_deg: 0.3
steps: all                     # ALL 33 steps × both signs = 66 images (critic M3: every step
                               # is inside the xtcav23 box [−41.5, −29.5]). Any exclusion must
                               # cite a pre-registered criterion (off-spot σ 230–265 µm at
                               # steps 28–31; step 33's 0.4° box margin) — none applied here;
                               # late steps serve as a residual check instead (D3.4d).
phase_window_deg: 0.2          # on-shots within ±0.2° of the step's median TCAV phase
phase_window_widen_deg: 0.3    # fallback when a target's split-half floor exceeds its signal
phi_ensemble_deg: null         # 3-point forward phase ensemble, enabled ONLY if D0.5 shows
                               # ν_y contamination survives the ±0.2° subset (e.g. [-0.3, 0.0, 0.3])

# --- V_eff (externally anchored, NOT a free parameter) -----------------------
cal_scaled: 14.402902846221519 # jitter-regression streak cal, m-screen per m-z equivalent
                               # (1049.905 µm/deg; summary.json cal_scaled_used)
voltage_V: calibrate           # fit.calibrate_veff(setup, cal_scaled): V such that the
                               # AS-BUILT segment's numerically-linearized streak calibration
                               # (incl. the 0.6 m drift) equals cal_scaled. Expected ≈28 MV.
veff_sensitivity_frac: 0.10    # pre-registered ±10% refit
fit_veff: false

# --- loss ---------------------------------------------------------------------
w_charge_split: 0.1
w_off: 0.1                     # TCAV-off channel weight (V=0 forward pass vs adjacent-step-
                               # pooled off targets; retains ~half its width sensitivity under
                               # model-side-only blur). Provisional; report a 0/0.1/0.3 check.
lambda: null                   # from D0.4 re-calibration on the 66-image geometry + blur
                               # (fit scripts refuse to run while null — D0 gating)
lambda_grid: [1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2, 1.0e-1]  # v3 picked the old
                               # top edge (1e-2), so the grid is extended upward
prior: ridge                   # pre-registered companions: student_t (ν=4), TSVD-5
delta_bound_frac: 0.5          # D2 reachability: the full training box (hard box; walls flagged)

# ν_y: tight prior (λ-scaled ln units). The Stage-C no-prior rationale
# was kicker-gate-specific and is obsolete; η_y is verified to −1.9% (Stage-C
# cross-check), so ν_y now represents residual dispersion/magnification only —
# and a loose ν_y is exactly the degeneracy channel sdelta needs protecting from.
nu_y_prior_sigma: 0.03

# --- discrete hypotheses --------------------------------------------------------
# 4 orientation/pairing combos (row order × streak-sign pairing) selected by loss on
# restart 0; pre-registered ratio: winner/runner-up ≥ 2×, else BOTH carried through
# the ensemble and reported (critic minor-10).
orientation_selection_ratio: 2.0
n_restarts: 8

# ============================ Stage D2 block =================================
# Reachability (interview): hard training box, weak ridge λ*/100 with the
# metrology σ_j table below, walls flagged (fit result u_final / tanh_sat).
# σ_δ and ε_x DROPPED (Ryan: injector knobs replace them); ν_y and L2_ref kept.
lambda_reach: 1.0e-4           # = Stage D λ* (0.01) / 100 — CNF inputs only (knobs, latent, L1/L2 shifts)
lambda_cal: 1.0e-2             # ν_y and δ_tr keep Stage D's λ*: they are measurement-chain terms with
                               # no box bound (at λ_reach δ_tr ran to −5…−8% k1 in 3 iterations)
l1ref_sigma_deg: 0.5           # fitted scalar L1 shift (BC11 BLEN feedback re-phases L1)
latent_resid_tau: 0.3          # 'shared_resid' arm: per-step residual prior = 0.3 × prior σ

# Fitted knob-δ: Stage D's 17 + all 14 injector-side knobs (12 Impact-T + L0B 2)
fit_knobs:
  - L1EnergyOffset
  - L2EnergyOffset
  - L3EnergyOffset
  - S1ELkG
  - S2ELkG
  - S3ELkG
  - Q5FFkG
  - Q4FFkG
  - Q3FFkG
  - S1EL_xOffset
  - S1EL_yOffset
  - S2EL_xOffset
  - S2EL_yOffset
  - S2ER_xOffset
  - S2ER_yOffset
  - S1ER_xOffset
  - S1ER_yOffset
  - L0BPhaseSet
  - L0BEnergyOffset
  - laser_timing_ps
  - "GUNF:rf_field_scale"
  - "GUNF:theta0_deg"
  - "distgen:t_dist:dists:d2:avg_t:value"
  - drive_fraction
  - "distgen:total_charge:value"
  - L0AF_phase_offset_deg
  - "SOL10111:solenoid_field_scale"
  - "distgen:r_dist:sigma_xy:value"
  - "distgen:r_dist:truncation_radius:value"
  - "distgen:start:MTE:value"
  - sigma_t_ps

# Prior widths σ_j, PHYSICAL units.
# Linac / FF: Stage D's table, EXCEPT the movers.
# Movers: 0.75 mm = a wide static prior on the absolute beam-to-sextupole offset
#   from golden (Ryan 2026-10-29: routine moves 1-200 µm, setups up to ±1.5 mm;
#   orbit is degenerate with the mover, so δ reads as beam-magnet offset).
# Injector: the RL "DAQ-like" shift-to-shift widths
#   (twobunch-s2e-rl configs/rl/eval/injector_ctx_2026-10-16.yaml); drive_fraction's
#   uniform half-width 0.06 -> σ = 0.06/√3. L0B: the readback-σ rule
#   (sweep_params.readback_sigma: 0.3° phase, 0.1% of the 59.5 MeV gain).
sigma_phys:
  L1EnergyOffset: 0.6e6
  L2EnergyOffset: 8.0e6
  L3EnergyOffset: 11.0e6
  S1ELkG: 10.5
  S2ELkG: 19.8
  S3ELkG: 5.4
  Q5FFkG: 0.36
  Q4FFkG: 0.41
  Q3FFkG: 0.50
  S1EL_xOffset: 0.75e-3
  S1EL_yOffset: 0.75e-3
  S2EL_xOffset: 0.75e-3
  S2EL_yOffset: 0.75e-3
  S2ER_xOffset: 0.75e-3
  S2ER_yOffset: 0.75e-3
  S1ER_xOffset: 0.75e-3
  S1ER_yOffset: 0.75e-3
  L0BPhaseSet: 0.3
  L0BEnergyOffset: 59.5e3
  laser_timing_ps: 0.1
  "GUNF:rf_field_scale": 121485.6
  "GUNF:theta0_deg": 0.25
  "distgen:t_dist:dists:d2:avg_t:value": 0.1
  drive_fraction: 0.0346
  "distgen:total_charge:value": 4.8
  L0AF_phase_offset_deg: 0.1
  "SOL10111:solenoid_field_scale": 0.00121875
  "distgen:r_dist:sigma_xy:value": 0.00745
  "distgen:r_dist:truncation_radius:value": 0.0126
  "distgen:start:MTE:value": 10.0
  sigma_t_ps: 0.00585
